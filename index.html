<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>
<style>
body{
  font-family: Arial, sans-serif;
  text-align:center;
  background:#ffe6f0;
  padding-top:100px;
}
button{
  padding:15px 30px;
  font-size:20px;
  border-radius:10px;
  cursor:pointer;
}
#msg{
  display:none;
  margin-top:30px;
  font-size:24px;
}
</style>
</head>
<body><h2>💌 A Small Surprise For You 💌</h2><button onclick="showMessage()">Click Me ❤️</button>

<div id="msg">
  Sorry for my mistakes ❤️<br><br>
  You are very important to me 🥺<br><br>
  No matter what happens...<br><br>
  I Love You Forever ❤️
</div><script>
function showMessage() {
  document.getElementById("msg").style.display = "block";
}
</script></body>
</html>
